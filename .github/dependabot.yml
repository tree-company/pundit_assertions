version: 2

updates:
- package-ecosystem: bundler
  groups:
    rubocop:
      patterns:
        - "rubocop"
        - "rubocop-*"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
